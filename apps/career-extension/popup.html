<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FlacronCV fill</title>
    <style>
      body {
        font: 14px/1.4 system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 280px;
        color: #002b62;
      }
      label {
        display: block;
        font-weight: 600;
        margin-top: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        min-height: 44px;
        margin-top: 4px;
        padding: 8px;
      }
      button {
        margin-top: 12px;
        min-height: 44px;
        width: 100%;
        font-weight: 600;
        background: #002b62;
        color: #fff;
        border: 0;
      }
      p {
        margin: 8px 0 0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <p>Fills example-jobs.test after you start it. FlacronCV does not send the form. Other sites and a store listing are not published.</p>
    <form id="fill-form">
      <label>API origin <input id="api-origin" name="apiOrigin" value="http://127.0.0.1:4101" /></label>
      <label>Session id <input id="session-id" name="sessionId" required /></label>
      <label>Access token <input id="token" name="token" type="password" required /></label>
      <button type="submit">Fill reviewed fields</button>
    </form>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
