<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>example-jobs.test fixture</title>
  </head>
  <body>
    <h1>Example job application</h1>
    <p>Serve this file as http://example-jobs.test/ for the unpacked extension. The extension never clicks submit.</p>
    <form action="/apply" method="post">
      <label>Full name <input name="full_name" /></label>
      <label>Email <input name="email" type="email" /></label>
      <label>Phone <input name="phone" /></label>
      <label>Notes <textarea name="notes"></textarea></label>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
