version: 0.2

# Web image build for AWS CodeBuild → ECR.
#
# WHY THIS FILE EXISTS
# The repo had buildspec-api.yml but nothing for the web app, so the web image
# was built by a buildspec configured inline in the CodeBuild console — and that
# one passes no --build-arg. NEXT_PUBLIC_* is INLINED INTO THE BROWSER BUNDLE by
# `next build`, so a value supplied only to the running container (task env, ECS
# task definition, Parameter Store at runtime) never reaches the compiled
# JavaScript. It compiles to `undefined`.
#
# That is what put this in production:
#   [firebase] NOT INITIALISED — Missing at BUILD time: NEXT_PUBLIC_FIREBASE_API_KEY, …
# and made sign-in fail with an empty Network tab (Firebase never initialised, so
# no request was ever sent).
#
# Every NEXT_PUBLIC_* the app reads must therefore be a --build-arg here, and the
# Dockerfile declares a matching ARG for each. The two lists must stay in sync.
#
# THESE VALUES ARE NOT SECRETS. Firebase web config ships inside the client
# bundle by design — anyone can read it in DevTools. Access is controlled by
# Firestore/Storage rules and App Check, not by hiding the apiKey. They are still
# read from the environment rather than hardcoded so that one repo can build for
# staging and production.
#
# SET THEM ON THE CODEBUILD PROJECT (Edit → Environment → Additional
# configuration → Environment variables), or swap the `variables:` block below
# for `parameter-store:` / `secrets-manager:` if you prefer them centralised.

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: "482881544977"
    ECR_REPOSITORY: flacroncv-web
    DOCKER_BUILDKIT: "1"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - IMAGE_TAG="$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION}" | cut -c 1-12)-${CODEBUILD_BUILD_NUMBER}"
      - test -n "${IMAGE_TAG}" || IMAGE_TAG="manual-$(date +%Y%m%d%H%M%S)"
      # Fail here, with a clear message, rather than shipping an image whose
      # bundle has `undefined` baked in. The Dockerfile guards the two most
      # critical ones too, but failing before the build saves several minutes.
      - |
        missing=""
        for v in NEXT_PUBLIC_API_URL NEXT_PUBLIC_SITE_URL \
                 NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
                 NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
                 NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID NEXT_PUBLIC_FIREBASE_APP_ID; do
          eval "val=\${$v}"
          test -n "${val}" || missing="${missing} ${v}"
        done
        if [ -n "${missing}" ]; then
          echo "ERROR: required build-time variables are not set on this CodeBuild project:${missing}"
          echo "NEXT_PUBLIC_* is inlined by 'next build'. Setting them on the ECS task has NO effect."
          exit 1
        fi
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

  build:
    commands:
      - echo "Building FlacronCV web image..."
      - |
        docker build --platform linux/amd64 \
          --file apps/web/Dockerfile \
          --tag "${ECR_REPOSITORY}:${IMAGE_TAG}" \
          --build-arg NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}" \
          --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL}" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${NEXT_PUBLIC_FIREBASE_API_KEY}" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${NEXT_PUBLIC_FIREBASE_PROJECT_ID}" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${NEXT_PUBLIC_FIREBASE_APP_ID}" \
          --build-arg NEXT_PUBLIC_GA4_MEASUREMENT_ID="${NEXT_PUBLIC_GA4_MEASUREMENT_ID}" \
          --build-arg NEXT_PUBLIC_ANALYTICS_PROVIDER="${NEXT_PUBLIC_ANALYTICS_PROVIDER}" \
          .
      - docker tag "${ECR_REPOSITORY}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
      # Prove the config actually landed in the client bundle before shipping.
      #
      # Verified with NODE, not grep, and deliberately so:
      #
      #  * node is guaranteed present — this is a node:20-alpine image. The image's
      #    grep is BusyBox, whose `-r` support cannot be assumed the way GNU grep's
      #    can, and a missing option there is indistinguishable from "not found".
      #  * String.includes() is a LITERAL match. grep would treat the needle as a
      #    basic regular expression; Firebase values contain `.`, `-` and `:`, so a
      #    future value could quietly match the wrong thing (or nothing).
      #  * It separates the three failure modes that the old check collapsed into
      #    one useless message, via distinct exit codes.
      #  * It reports COUNTS, never the value itself, so nothing lands in the logs.
      #
      # The shell structure matters as much as the tool. The previous version put
      # `|| (echo "...")` INSIDE the `sh -c "..."` string with nested unescaped
      # double quotes and no closing quote, so the CodeBuild shell died with
      # "unexpected EOF while looking for matching quote" — exit status 2 — before
      # docker ever ran. Here the container command is a single-quoted script (no
      # shell interpolation possible) and ALL error handling lives outside it in a
      # plain if/else, so that class of quoting bug cannot recur.
      - |
        echo "Verifying the Firebase project id is inlined in the client bundle..."
        if docker run --rm \
             --env VERIFY_NEEDLE="${NEXT_PUBLIC_FIREBASE_PROJECT_ID}" \
             --entrypoint node "${ECR_REPOSITORY}:${IMAGE_TAG}" \
             -e 'const fs=require("fs"),p=require("path");const dir="/app/apps/web/.next/static";const needle=process.env.VERIFY_NEEDLE||"";if(!needle){console.error("verify: VERIFY_NEEDLE is empty");process.exit(2)}if(!fs.existsSync(dir)){console.error("verify: missing directory "+dir);process.exit(3)}let files=0,hits=0;(function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const q=p.join(d,e.name);if(e.isDirectory()){walk(q)}else{files++;if(fs.readFileSync(q,"latin1").includes(needle)){hits++}}}})(dir);console.log("verify: scanned "+files+" files; "+hits+" contain the project id");process.exit(hits>0?0:1)'; then
          echo "Bundle verification passed."
        else
          status=$?
          echo "ERROR: Firebase config is NOT inlined in the client bundle (verifier exit ${status})."
          echo "  1 = project id found in no file under .next/static (build args did not reach next build)"
          echo "  2 = NEXT_PUBLIC_FIREBASE_PROJECT_ID was empty in the CodeBuild environment"
          echo "  3 = /app/apps/web/.next/static does not exist in the image (Dockerfile COPY problem)"
          echo "Refusing to push this image."
          exit 1
        fi

  post_build:
    commands:
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING}" = "1" ]; then
          echo "Pushing image to Amazon ECR..."
          # `|| exit 1` is load-bearing. CodeBuild takes the exit status of the
          # LAST statement in a '- |' block, and there is no `set -e`, so an
          # unchecked `docker push` failure was discarded: the block carried on,
          # wrote imagedefinitions.json naming an image that is not in the
          # registry, printed "Image pushed successfully", and exited 0 on the
          # final echo. CodeBuild reported SUCCEEDED, CodePipeline registered an
          # ECS task-definition revision pointing at a missing image, and every
          # task died with CannotPullContainerError while the log claimed the
          # push worked. Triggered by a missing ecr:PutImage permission, a layer
          # upload timeout, throttling, or a full build volume.
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" || exit 1

          # Written only AFTER the push is confirmed, so the deploy artifact can
          # never name an image that was not uploaded.
          printf '[{"name":"flacroncv-web","imageUri":"%s"}]' \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            > imagedefinitions.json

          echo "Image pushed successfully:"
          echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        else
          # Deliberately not "Docker build failed" — this branch fires for ANY
          # earlier failure, and saying "build failed" sent us hunting through a
          # Docker build that had actually succeeded. The real failure is
          # whichever command in pre_build/build reported it, above this line.
          echo "An earlier phase failed; skipping ECR push. See the first error above."
          exit 1
        fi

artifacts:
  files:
    - imagedefinitions.json
