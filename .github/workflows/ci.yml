name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

  # The suite previously ran nowhere. Lint, type-check, build and the Docker
  # build were all gated — but nothing executed a single test, so the API and
  # web suites could go red and still merge. Several defects this project has
  # shipped were exactly the kind a test catches and a type-check cannot:
  # a translation key missing from every locale, an audit row silently dropped
  # by an undefined field, a date filter parsed in the wrong timezone.
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # shared-types is consumed from its build output, so the API suite cannot
      # resolve @flacroncv/shared-types until it has been compiled.
      - name: Build shared-types
        run: pnpm --filter @flacroncv/shared-types build

      # Runs both suites: apps/api (jest) and apps/web (vitest). The web suite
      # includes the three i18n gates — locale parity, no hardcoded English, and
      # every t() key resolving — which are the only checks that catch an
      # untranslated string before a user sees it.
      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_FIREBASE_API_KEY: fake_key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: fake.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: fake-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: fake.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000:web:000'

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t flacroncv-api:latest .

      # `docker build` does NOT inherit the step environment — a build only sees
      # values passed as --build-arg and declared with ARG in the Dockerfile.
      # These were set as `env:`, so the build received none of them and the
      # image was compiled with every NEXT_PUBLIC_* undefined. The Dockerfile now
      # fails fast when ANY of the eight required ones is missing, and then reads
      # the emitted chunks to confirm they were actually inlined — so this job is
      # the regression guard for the whole ARG → ENV → `next build` → bundle path,
      # on every push to main, with throwaway values.
      - name: Build Web Docker image
        run: |
          docker build -f apps/web/Dockerfile -t flacroncv-web:latest . \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1 \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=fake_key \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=fake.firebaseapp.com \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=fake-project \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=fake.appspot.com \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000 \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:000:web:000
