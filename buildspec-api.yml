version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: "482881544977"
    ECR_REPOSITORY: flacroncv-api
    DOCKER_BUILDKIT: "1"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - IMAGE_TAG="$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION}" | cut -c 1-12)"
      - test -n "${IMAGE_TAG}" || IMAGE_TAG="manual-$(date +%Y%m%d%H%M%S)"
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

  build:
    commands:
      - echo "Building FlacronCV API image..."
      - docker build --platform linux/amd64 --file apps/api/Dockerfile --tag "${ECR_REPOSITORY}:${IMAGE_TAG}" .
      - docker tag "${ECR_REPOSITORY}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

  post_build:
    commands:
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING}" = "1" ]; then
          echo "Pushing image to Amazon ECR..."
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          printf '[{"name":"flacroncv-api","imageUri":"%s"}]' \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            > imagedefinitions.json

          echo "Image pushed successfully:"
          echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        else
          echo "Docker build failed; skipping ECR push."
          exit 1
        fi

artifacts:
  files:
    - imagedefinitions.json
